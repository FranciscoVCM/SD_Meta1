<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Googol Search</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* TOP BAR */
        .top-bar {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            background: #241f2d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.23);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #ff9248;
            margin-right: 25px;
            text-decoration: none;
        }

        .search-container {
            flex: 0 1 700px;
            max-width: 700px;
            width: 100%;
            display: flex;
            background: white;
            border-radius: 30px;
            padding: 6px 20px;
            align-items: center;
            margin-right: 40px;
        }

        .search-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 10px;
        }

        .search-btn {
            background: #ffb782;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #ffcaa4;
        }

        /* MAIN WRAPPER */
        .page-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .main-grid {
            width: 95%;
            max-width: 1500px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
        }

        /* LEFT: SEARCH RESULTS */
        .results h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 26px;
        }

        .result-item {
            background: #3a3344;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 22px;
            transition: 0.2s;
        }

        .result-item:hover {
            background: #463d51;
        }

        .result-item a {
            font-size: 22px;
            color: #ffae6d;
            text-decoration: none;
        }

        .snippet {
            margin-top: 6px;
            font-size: 15px;
            color: #d0c4e4;
        }

        .meta span {
            margin-right: 12px;
            font-size: 14px;
            color: #b8accd;
        }

        /* RIGHT: AI PANEL */
        .ai-panel {
            background: #322c3d;
            padding: 20px;
            border-radius: 16px;
            min-height: 250px;
        }

        .ai-panel h2 {
            margin-top: 0;
            color: #ffae6d;
            font-size: 26px;
        }

        .ai-output {
            background: #2a2431;
            padding: 16px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.45;
            color: #e8ddff;
            font-size: 15.5px;
            min-height: 160px;
        }

        /* PAGINATION */
        .pagination {
            margin: 30px 0;
            text-align: center;
        }

        .pagination a {
            margin: 0 6px;
            padding: 8px 14px;
            background: #423857;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        .pagination a:hover {
            background: #5c5078;
        }

        .current {
            background: #ff9248 !important;
            color: black !important;
            font-weight: bold;
        }

        /* RESPONSIVE */
        @media (max-width: 1050px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="/" class="logo">Googol</a>

    <form action="/search" method="get" class="search-container">
        <input type="text" name="terms" placeholder="Pesquisar..." th:value="${terms}">
        <button class="search-btn">Pesquisar</button>
    </form>
</div>

<!-- GRID MAIN -->
<div class="page-wrapper">
    <div class="main-grid">

        <!-- LEFT COLUMN -->
        <div class="results">

            <h2 th:if="${terms != ''}"
                th:text="'Resultados para: ' + ${terms}">
            </h2>

            <!-- Caso não haja resultados -->
            <div th:if="${result != null && result.items.size() == 0}"
                 style="margin-top:20px; font-size:20px;">
                Nenhum resultado encontrado.
            </div>

            <!-- LISTA DE RESULTADOS -->
            <div th:each="i : ${result.items}" class="result-item">

                <a th:href="${i.url}" th:text="${i.title}" target="_blank"></a>

                <div class="snippet" th:text="${i.snippet}"></div>

                <div class="meta">
                    <span th:text="'Inlinks: ' + ${i.inlinks}"></span>
                    <span th:text="'Outlinks: ' + ${i.outlinks}"></span>
                </div>

            </div>

            <!-- PAGINATION -->
            <div th:if="${result != null && result.total > 10}" class="pagination">
                <a th:each="p : ${#numbers.sequence(1, (result.total / 10) + 1)}"
                   th:href="@{'/search'(terms=${terms}, page=${p})}"
                   th:text="${p}"
                   th:classappend="${p == result.page} ? 'current'">
                </a>
            </div>
        </div>

        <!-- RIGHT COLUMN (AI PANEL) -->
        <div class="ai-panel" th:if="${analysis != null and analysis != ''}">
            <h2>Análise AI:</h2>

            <div class="ai-output" th:text="${analysis}">
            </div>
        </div>

    </div>
</div>

</body>
</html>
