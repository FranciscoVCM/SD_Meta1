<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stats</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 40px;
        }

        .panel {
            background: #3a3344;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            margin: 25px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        td, th {
            padding: 12px;
            border-bottom: 1px solid #564c63;
        }

        th {
            color: #cba6f7;
            text-align: left;
        }
    </style>
</head>
<body>

<h1>Estatísticas do Sistema (Tempo Real)</h1>

<div class="panel">
    <h2>Top 10 Pesquisas</h2>
    <table>
        <tbody id="topQueries"></tbody>
    </table>
</div>

<div class="panel">
    <h2>Barrels</h2>
    <table>
        <tbody id="barrels"></tbody>
    </table>
</div>

<div class="panel">
    <h2>Sistema</h2>
    <div id="system"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>

    let stomp = Stomp.over(new SockJS("/ws"));
    stomp.connect({}, () => {
        stomp.subscribe("/topic/stats", msg => {
            let data = JSON.parse(msg.body);

            let tq = "";
            data.topQueries.forEach(q => {
                tq += `<tr><td>${q.term}</td><td>${q.count}</td></tr>`;
            });
            document.querySelector("#topQueries").innerHTML = tq;

            let barrels = "";
            data.barrels.forEach(b => {
                barrels += `<tr><td>${b.name}</td><td>${b.docs}</td><td>${b.avgLatency.toFixed(2)}s</td></tr>`;
            });
            document.querySelector("#barrels").innerHTML = barrels;

            document.querySelector("#system").innerHTML =
                `Documentos: ${data.system.docs}<br>Termos: ${data.system.terms}<br>Postings: ${data.system.postings}`;
        });
    });
</script>

</body>
</html>
