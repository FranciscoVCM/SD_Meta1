<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>HackerNews Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #2e2a38;
      color: #f2ebff;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =============================
       TOP BAR
    ============================== */
    .top-bar {
      width: 100%;
      padding: 20px;
      display: flex;
      align-items: center;
      background: #241f2d;
      box-shadow: 0px 2px 8px rgba(0,0,0,0.25);
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #ff9248;
      margin-right: 25px;
      text-decoration: none;
    }

    .search-container {
      flex: 1;
      display: flex;
      background: white;
      border-radius: 30px;
      padding: 6px 18px;
      align-items: center;
    }

    .search-container input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      padding: 8px;
    }

    .search-btn {
      background: #ffb782;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.25s;
    }

    .search-btn:hover {
      background: #ffcaa4;
    }

    /* =============================
       RESULTS
    ============================== */

    .results {
      margin: 40px auto;
      width: 90%;
      max-width: 900px;
    }

    .item {
      margin: 25px 0;
      padding: 22px;
      background: #3a3347;
      border-radius: 10px;
      transition: 0.2s;
    }

    .item:hover {
      background: #433b54;
    }

    .item a {
      color: #ffa860;
      font-size: 20px;
      text-decoration: none;
    }

    .meta {
      margin-top: 8px;
      font-size: 14px;
      color: #d9d1e6;
    }

    .no-results {
      text-align: center;
      font-size: 20px;
      margin-top: 30px;
      color: #d0c5e6;
    }

    /* =============================
       PAGINATION
    ============================== */
    .pagination {
      text-align: center;
      margin: 40px 0;
    }

    .pagination a {
      margin: 0 6px;
      padding: 8px 14px;
      background: #423857;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.2s;
    }

    .pagination a:hover {
      background: #5c5078;
    }

    .current {
      background: #ff9248 !important;
      color: black !important;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div class="top-bar">
  <a class="logo" href="/">Googol</a>

  <form action="/hn" method="get" class="search-container">
    <input type="text" name="term" placeholder="Pesquisar HackerNews..."
           th:value="${term}">
    <button type="submit" class="search-btn">Pesquisar</button>
  </form>
</div>


<!-- RESULTS -->
<div class="results">

  <!-- Title -->
  <h2 th:if="${result != null and term != ''}"
      th:text="'Resultados para: ' + term">
  </h2>

  <!-- No results -->
  <div th:if="${result != null and #lists.isEmpty(result.items)}" class="no-results">
    Nenhum resultado encontrado.
  </div>

  <!-- Items -->
  <div th:each="i : ${result.items}" class="item">
    <a th:href="${i.url}" th:text="${i.title}" target="_blank"></a>

    <div class="meta">
      Autor: <span th:text="${i.author}"></span> •
      Pontos: <span th:text="${i.points}"></span> •
      Comentários: <span th:text="${i.comments}"></span> •
      <span th:text="${i.createdAt}"></span>
    </div>
  </div>

  <!-- Pagination -->
  <div th:if="${result != null and result.totalPages > 1}" class="pagination">
    <a th:each="p : ${#numbers.sequence(0, result.totalPages - 1)}"
       th:href="@{'/hn'(term=${term}, page=${p})}"
       th:text="${p + 1}"
       th:classappend="${p == result.page} ? 'current'">
    </a>
  </div>

</div>

</body>
</html>
