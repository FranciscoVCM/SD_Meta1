<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Backlinks</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 20px;
        }

        .box {
            background: #3a3344;
            padding: 25px;
            border-radius: 15px;
            width: 70%;
            margin: auto;
        }

        li {
            color: #d3c4ff;
            font-size: 18px;
            margin: 8px 0;
        }

        input[type="text"] {
            width: 70%;
            padding: 15px;
            border-radius: 30px;
            border: none;
            margin-bottom: 15px;
            font-size: 18px;
        }

        button {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            background: #cba6f7;
            color: #2b2535;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover { background: #e0c4ff; }
    </style>
</head>
<body>

<h1>Backlinks</h1>

<form action="/backlinks" method="get">
    <input type="text" name="url" placeholder="Enter URL..." required>
    <button type="submit">Check</button>
</form>

<div class="box" th:if="${url}">
    <h2 th:text="${url}"></h2>
    <ul>
        <li th:each="b : ${backlinks}" th:text="${b}"></li>
    </ul>
</div>

<div th:if="${error}" style="color:#ff8080; margin-top:20px;">
    <p th:text="${error}"></p>
</div>

</body>
</html>
