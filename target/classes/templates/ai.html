<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IA Summary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #2e2a38;
            color: white;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
            width: 100%;
            padding: 20px;
            background: #241f2d;
            font-size: 28px;
            font-weight: bold;
            color: #d8b4ff;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #3a3347;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            margin-top: 12px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #d8b4ff;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #c8a8ff;
        }

        .summary-box {
            margin-top: 20px;
            padding: 18px;
            background: #241f2d;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="top-bar"> IA — Resumo Automático</div>

<div class="container">

    <form method="post" action="/ai/summary">
        <textarea name="text" placeholder="Escreve aqui o texto a resumir..."
                  th:text="${input}"></textarea>

        <button type="submit">Gerar Resumo</button>
    </form>

    <div th:if="${summary}" class="summary-box">
        <h3>Resumo:</h3>
        <p th:text="${summary}"></p>
    </div>

</div>

</body>
</html>
