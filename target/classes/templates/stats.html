<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stats</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 40px;
        }

        .panel {
            background: #3a3344;
            padding: 25px;
            border-radius: 15px;
            width: 80%;
            margin: 25px auto;
            box-shadow: 0px 0px 8px rgba(0,0,0,0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        td, th {
            padding: 12px;
            border-bottom: 1px solid #564c63;
        }

        th {
            color: #ffae6d;
            font-size: 18px;
            text-align: left;
        }

        .system-line {
            font-size: 18px;
            padding: 8px 0;
        }
    </style>
</head>
<body>

<h1>Estatísticas do Sistema (Tempo Real)</h1>

<!-- =================== TOP QUERIES ====================== -->
<div class="panel">
    <h2>Top 10 Pesquisas</h2>
    <table>
        <thead>
        <tr>
            <th>Termo</th>
            <th>Frequência</th>
        </tr>
        </thead>
        <tbody id="topQueries"></tbody>
    </table>
</div>

<!-- =================== BARRELS ====================== -->
<div class="panel">
    <h2>Barrels</h2>
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th># Documentos</th>
            <th>Latência Média</th>
        </tr>
        </thead>
        <tbody id="barrels"></tbody>
    </table>
</div>

<!-- =================== SISTEMA ====================== -->
<div class="panel">
    <h2>Sistema</h2>
    <div id="system"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>

    function safeJSON(x) {
        try { return JSON.parse(x); }
        catch { return {}; }
    }

    let stomp = Stomp.over(new SockJS("/ws"));

    stomp.connect({}, () => {

        stomp.subscribe("/topic/stats", msg => {
            let data = safeJSON(msg.body);

            /* ----------------------------
               TOP QUERIES
            ---------------------------- */
            let tq = document.getElementById("topQueries");
            tq.innerHTML = "";

            if (data.topQueries && Array.isArray(data.topQueries)) {
                data.topQueries.forEach(q => {
                    if (q.term !== undefined && q.count !== undefined)
                        tq.innerHTML += `
                            <tr>
                                <td>${q.term}</td>
                                <td>${q.count}</td>
                            </tr>`;
                });
            }

            /* ----------------------------
               BARRELS
            ---------------------------- */
            let bs = document.getElementById("barrels");
            bs.innerHTML = "";

            if (data.barrels && Array.isArray(data.barrels)) {
                data.barrels.forEach(b => {
                    let latency = b.avgLatency !== undefined ? b.avgLatency.toFixed(2) : "0.00";
                    bs.innerHTML += `
                        <tr>
                            <td>${b.name}</td>
                            <td>${b.docs}</td>
                            <td>${latency}s</td>
                        </tr>`;
                });
            }

            /* ----------------------------
               SYSTEM STATS
            ---------------------------- */
            let sys = data.system || {};
            let sdiv = document.getElementById("system");

            sdiv.innerHTML = `
                <div class="system-line">Documentos: <b>${sys.docs ?? 0}</b></div>
                <div class="system-line">Termos: <b>${sys.terms ?? 0}</b></div>
                <div class="system-line">Postings: <b>${sys.postings ?? 0}</b></div>
            `;
        });
    });

</script>

</body>
</html>
