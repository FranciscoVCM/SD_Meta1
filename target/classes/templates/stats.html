<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Estatísticas em Tempo Real</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            padding: 1rem;
            font-family: Arial;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        td, th {
            padding: .5rem;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>

<body>

<h2>Estatísticas do Sistema (tempo real)</h2>

<h3>Top 10 Pesquisas</h3>
<table>
    <tbody id="topQueries"></tbody>
</table>

<h3>Barrels Ativos</h3>
<table>
    <tbody id="barrels"></tbody>
</table>

<h3>Sistema</h3>
<div id="system"></div>

<script>
    let stomp = Stomp.over(new SockJS("/ws"));

    stomp.connect({}, () => {
        stomp.subscribe("/topic/stats", msg => {
            let data = JSON.parse(msg.body);

            // ---------- TOP QUERIES ----------
            let tq = "";
            data.topQueries.forEach(q => {
                tq += `<tr><td>${q.term}</td><td>${q.count}</td></tr>`;
            });
            document.querySelector("#topQueries").innerHTML = tq;

            // ---------- BARRELS ----------
            let b = "";
            data.barrels.forEach(x => {
                b += `<tr>
                        <td>${x.name}</td>
                        <td>${x.docs}</td>
                        <td>${x.avgLatency.toFixed(2)} s</td>
                      </tr>`;
            });
            document.querySelector("#barrels").innerHTML = b;

            // ---------- SYSTEM ----------
            document.querySelector("#system").innerHTML =
                "Documentos: " + data.system.docs +
                "<br>Termos: " + data.system.terms +
                "<br>Postings: " + data.system.postings;
        });
    });
</script>

</body>
</html>
