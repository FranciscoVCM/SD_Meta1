<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Backlinks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { padding: 1rem; font-family: Arial, sans-serif; }
        ul { max-width: 600px; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>

<h2>Backlinks para: <span th:text="${url}"></span></h2>

<ul>
    <li th:each="u : ${backlinks}">
        <a th:href="${u}" th:text="${u}" target="_blank"></a>
    </li>
</ul>

<a href="/">Voltar</a>

</body>
</html>
