<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Live Stream</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            font-family: Arial;
            padding: 40px;
        }

        h1 { text-align: center; font-size: 42px; }

        .panel {
            background: #3a3344;
            padding: 20px;
            width: 70%;
            margin: 20px auto;
            border-radius: 15px;
        }

        li {
            margin: 5px 0;
            color: #d3c4ff;
        }
    </style>
</head>
<body>

<h1>Live System Stream</h1>

<div class="panel">
    <h2>Queue Size</h2>
    <h3 id="queueValue">loading...</h3>
</div>

<div class="panel">
    <h2>Top Queries</h2>
    <ul id="topQueries"></ul>
</div>

<div class="panel">
    <h2>Latência por Barrel</h2>
    <ul id="latencies"></ul>
</div>

<div class="panel">
    <h2>Última Pesquisa</h2>
    <p id="lastSearch">loading...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    let stomp = Stomp.over(new SockJS("/ws"));
    stomp.connect({}, () => {

        stomp.subscribe("/topic/queue", msg => {
            document.getElementById("queueValue").innerText = msg.body;
        });

        stomp.subscribe("/topic/stats", msg => {
            let data = JSON.parse(msg.body);

            let tq = "";
            data.topQueries.forEach(q => { tq += `<li>${q.term} — ${q.count}</li>`; });
            document.querySelector("#topQueries").innerHTML = tq;

            let lat = "";
            data.barrels.forEach(b => { lat += `<li>${b.name}: ${b.avgLatency.toFixed(2)}s</li>`; });
            document.querySelector("#latencies").innerHTML = lat;

            if (data.lastSearchMs !== undefined)
                document.getElementById("lastSearch").innerText = data.lastSearchMs + " ms";
        });
    });
</script>

</body>
</html>
