<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Googol Search</title>

    <style>
        body {
            background: #2b2535;
            color: #f0e6ff;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            background: #241f2d;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.23);
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #ff9248;
            margin-right: 25px;
            text-decoration: none;
        }

        .search-container {
            flex: 0 1 600px;
            max-width: 600px;
            width: 100%;
            display: flex;
            background: white;
            border-radius: 30px;
            padding: 6px 20px;
            align-items: center;
        }

        .search-container input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 18px;
            padding: 10px;
        }

        .search-btn {
            background: #ffb782;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-btn:hover {
            background: #ffcaa4;
        }

        /* MAIN WRAPPER */
        .results-wrapper {
            margin: 30px auto;
            display: flex;
            width: 95%;
            max-width: 1300px;
            gap: 28px;
        }

        /* LEFT COLUMN: SEARCH RESULTS */
        .results {
            flex: 3;
        }

        .result-item {
            background: #3a3344;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .result-item:hover {
            background: #463d51;
        }

        .result-item a {
            font-size: 22px;
            color: #ffae6d;
            text-decoration: none;
        }

        .snippet {
            margin-top: 6px;
            font-size: 15px;
            color: #d0c4e4;
        }

        .meta span {
            margin-right: 12px;
            font-size: 14px;
            color: #b8accd;
        }

        /* RIGHT COLUMN: AI PANEL */
        .side-panel {
            flex: 2;
            background: #322c3d;
            padding: 20px;
            border-radius: 14px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .side-panel h2 {
            margin-top: 0;
            color: #ffae6d;
        }

        .ai-output {
            background: #2a2431;
            padding: 15px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.45;
            color: #e8ddff;
        }

        /* Pagination */
        .pagination {
            margin: 30px 0;
            text-align: center;
        }

        .pagination a {
            margin: 0 6px;
            padding: 8px 14px;
            background: #423857;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
        }

        .pagination a:hover {
            background: #5c5078;
        }

        .current {
            background: #ff9248 !important;
            color: black !important;
            font-weight: bold;
        }

        /* RESPONSIVE */
        @media (max-width: 950px) {
            .results-wrapper {
                flex-direction: column;
            }
            .side-panel {
                order: -1;
                width: 100%;
            }
        }
    </style>

</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="/" class="logo">Googol</a>

    <form action="/search" method="get" class="search-container">
        <input type="text" name="terms" placeholder="Pesquisar..."
               th:value="${terms}">
        <button class="search-btn">Pesquisar</button>
    </form>
</div>



<!-- MAIN CONTENT -->
<div class="results-wrapper">

    <!-- LEFT COLUMN: SEARCH RESULTS -->
    <div class="results">

        <!-- Título aparece sempre que o utilizador pesquisou algo -->
        <h2 th:if="${terms != null and terms != ''}"
            th:text="'Resultados para: ' + ${terms}">
        </h2>

        <!-- Caso não haja resultados -->
        <!-- Caso não haja resultados -->
        <div th:if="(${terms != null and terms != ''})
            and
            (${result == null}
             or ${result.items == null}
             or ${result.items.size() == 0})"
             style="margin-top:20px; font-size:20px;">
            Nenhum resultado encontrado.
        </div>


        <!-- Lista de resultados -->
        <div th:if="${result != null}">
            <div th:each="i : ${result.items}" class="result-item">

                <a th:href="${i.url}" th:text="${i.title}" target="_blank"></a>

                <div class="snippet" th:text="${i.snippet}"></div>

                <div class="meta">
                    <span th:text="'Inlinks: ' + ${i.inlinks}"></span>
                    <span th:text="'Outlinks: ' + ${i.outlinks}"></span>
                </div>

            </div>
        </div>

        <!-- Paginação -->
        <div th:if="${result != null and result.total > 10}" class="pagination">
            <a th:each="p : ${#numbers.sequence(1, (result.total / 10) + 1)}"
               th:href="@{'/search'(terms=${terms}, page=${p})}"
               th:text="${p}"
               th:classappend="${p == result.page} ? 'current'">
            </a>
        </div>

    </div>




    <!-- RIGHT COLUMN: AI PANEL -->
    <div class="side-panel" th:if="${result != null}">
        <h2>Análise AI:</h2>

        <p th:if="${analysis == null or analysis == ''}">
            Nenhuma análise disponível.
        </p>

        <pre th:if="${analysis != null and analysis != ''}"
             th:text="${analysis}"
             style="white-space: pre-wrap; margin-top: 10px;">
    </pre>
    </div>

</div>


</body>
</html>
